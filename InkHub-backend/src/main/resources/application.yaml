server:
  port: 8080

spring:
  application:
    name: InkHub-backend
  ai:
    model:
      chat: deepseek      # 只启用 DeepSeek 对话模型（openai starter 仅用其 embedding）
      embedding: openai   # 只启用 OpenAI 兼容 embedding（百炼）
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}
      embedding:
        options:
          model: qwen3.7-text-embedding-flash
    vectorstore:
      qdrant:
        host: localhost
        port: 6334        # gRPC 端口（Spring AI Qdrant 客户端走 gRPC，6333 是 HTTP）
        collection-name: inkhub_articles
        initialize-schema: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/inkhub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MySQL_Password}
    hikari:
      maximum-pool-size: 10
  data:
      redis:
        host: localhost
        port: 6379
        database: 0
        password: #没用设置密码
        timeout: 5s
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 0
  jackson:
      date-format: yyyy-MM-dd HH:mm:ss
      time-zone: GMT+8

  mail:
    # 邮件服务（目前仅用于「忘记密码」验证码）；账号密码一律走环境变量
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

jwt:
  secret: ${JWT_SECRET}
  expire: 7200000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: package com.example.InkHub_backend.entity;
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.example.InkHub_backend.controller

inkhub:
  mail:
    # 未配置 SMTP 账号时：true = 验证码打到后端日志（仅本地调试用），false = 直接报错
    dev-log-code: ${MAIL_DEV_LOG_CODE:true}

upload:
  dir: ./uploads

ai:
  top-k: 5
  min-score: 0.35
  max-chunk-per-article: 2
  chunk-size: 600
  chunk-overlap: 100
  rate-limit: 20
  search-top-n: 20
  # 混合检索融合参数
  vector-weight: 1.0
  bm25-weight: 0.3
  bm25-top-n: 5
  # Rerank 精排配置（阿里百炼 gte-rerank）
  rerank-model: qwen3-rerank
  rerank-base-url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
  rerank-api-key: ${DASHSCOPE_API_KEY}